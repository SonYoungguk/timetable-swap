# main 에 올릴 때마다 Supabase 에 연결되는 화면을 빌드해 GitHub Pages 에 올린다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 한다.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
        env:
          # 공개용(publishable) 키라 저장소에 두어도 된다. 접근 권한은 Supabase 의 RLS 규칙이 막는다.
          VITE_SUPABASE_URL: https://iunhobhlcsiianixjrih.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_y-jpiV_AprtCadEZFRFjvA_ym3i1cHC
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
